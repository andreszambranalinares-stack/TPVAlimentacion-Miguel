spring:
  application:
    name: tpv-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never # la crea Flyway (V10__spring_session.sql)
      cleanup-cron: "0 */30 * * * *" # descarta sesiones caducadas cada 30 min

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
