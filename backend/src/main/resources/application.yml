spring:
  application:
    name: tpv-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
